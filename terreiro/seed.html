<body>
  <h2>Importar dados iniciais — Templo Pai Tuiamissu</h2>
  <p>Clique para importar <strong>Orixás, Datas Sagradas, Ensinamentos, Ervas &amp; Banhos e Rezas &amp; Orações</strong> no Firestore.<br>
  <strong style="color:#8b1a1a;">Execute apenas uma vez! Se já importou antes, use o botão "Só Ensinamentos" abaixo.</strong></p>
  <button id="btn-seed">Importar tudo</button>
  <button id="btn-seed-ensinamentos" style="background:#5a3e00; margin-left:1rem;">Reimportar só Ensinamentos</button>
  <div id="log">Aguardando...</div>

  <script type="module">
    import { db, auth } from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const log = document.getElementById("log");
    function print(msg, type = "ok") {
      const span = document.createElement("span");
      span.className = type;
      span.textContent = msg + "\n";
      log.appendChild(span);
      log.scrollTop = log.scrollHeight;
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        log.textContent = "Não autenticado. Faça login primeiro.";
        document.getElementById("btn-seed").disabled = true;
        document.getElementById("btn-seed-ensinamentos").disabled = true;
      }
    });

O Kardecismo foi iniciado na França com Allan Kardec (Hippolyte Léon Denizard Rivail), que codificou a doutrina espírita em cinco volumes: "O livro dos Espíritos" (1857), "O Livro dos Médiuns" (1861), "O Evangelho Segundo o Espiritismo" (1864), "O Céu e o Inferno" (1865) e "A Gênese" (1868). No Brasil, Chico Xavier foi o médium que mais se destacou na prática da psicografia, chegando a publicar mais de 400 livros. As principais práticas karcedistas são os trabalhos de mesa branca, os trabalhos de cura e as psicografias. Nessa doutrina, o médium recebe a incorporação ou a inspiração de um trabalhador do astral (Espírito de Luz). Não há o uso de elementos nos trabalhos e nem imagens de santos, exceto o uso de vestimenta branca, toalhas brancas sobre a mesa e água para receber a fluidificação. Também não há celebrações de rituais como batizados, casamentos, etc.

UMBANDA
A Umbanda teve início no Brasil em 1908 através do médium Zélio Fernandino de Moraes e do Caboclo das Sete Encruzilhadas. Sua prática principal é a incorporação de entidades para atendimento às pessoas que carecem de cuidados físicos e/ou espirituais. Tem como base sete linhas de Orixás, onde cada linha representa um Dom Divino (Fé, Amor, Conhecimento, Justiça, Lei, Evolução e Geração da Vida). São usados vários tipos de elementos em suas práticas: fumo, ervas, defumação, oferendas, fios de contas, som do atabaque etc. O médium que se destacou na psicografia, até então atribuída somente ao Kardecismo, foi Pai Rubens Saraceni. Há a celebração de rituais, como o batismo, o casamento, o funeral, a coroação etc.

CANDOMBLÉ
Religião africana, de culto aos Orixás, classificada em dois grandes grupos que predominaram aqui no Brasil, dos yorubá (nagô, vindos principalmente da Nigéria) e djedje (foi em sua maioria do Daomé) onde o primeiro excedia em número de quase oito vezes maior que o segundo. No Candomblé existe a incorporação dos Orixás, mas os médiuns incorporados não realizam atendimento ao público, sendo este feito através do "jogo de búzios" ou "Ifà", não aceitando a comunicação de espíritos e proibindo sua incorporação, os trabalhos mediúnicos de incorporação contam apenas com a presença de Orixás que transmitem seu Axé aos presentes.`

Que meu coração esteja puro e disposto para a caridade.

Dai-me paciência para aprender com cada lição.

    document.getElementById("btn-seed").addEventListener("click", async () => {
      const btn = document.getElementById("btn-seed");
      const btn2 = document.getElementById("btn-seed-ensinamentos");
      btn.disabled = true;
      btn2.disabled = true;
      log.textContent = "";
      print("=== IMPORTAÇÃO COMPLETA INICIADA ===\n", "sec");

      const ALL_ENSINAMENTOS = [
        ...ENSINAMENTOS_AULAS,
        ...ENSINAMENTOS_FUNDAMENTOS,
        ...ENSINAMENTOS_RITUAIS,
        ...ENSINAMENTOS_MEDIUNIDADE,
        ...ENSINAMENTOS_SAUDACOES,
        ...ENSINAMENTOS_ANJO
      ];

      // Orixás
      print("--- Orixás ---", "sec");
      for (const o of ORIXAS) {
        try { await addDoc(collection(db, "orixas"), { ...o, criadoEm: serverTimestamp() }); print("✔ " + o.nome); }
        catch(e) { print("✘ " + o.nome + ": " + e.message, "err"); }
      }

      // Datas Sagradas
      print("\n--- Datas Sagradas ---", "sec");
      for (const d of DATAS_SAGRADAS) {
        try { await addDoc(collection(db, "datasagradas"), { ...d, criadoEm: serverTimestamp() }); print("✔ " + d.nome); }
        catch(e) { print("✘ " + d.nome + ": " + e.message, "err"); }
      }

      // Ensinamentos
      print("\n--- Ensinamentos (" + ALL_ENSINAMENTOS.length + " textos) ---", "sec");
      for (const e of ALL_ENSINAMENTOS) {
        try { await addDoc(collection(db, "ensinamentos"), { ...e, criadoEm: serverTimestamp() }); print("✔ [" + e.categoria + "] " + e.titulo); }
        catch(err) { print("✘ " + e.titulo + ": " + err.message, "err"); }
      }

      // Ervas
      print("\n--- Ervas & Banhos ---", "sec");
      for (const er of ERVAS) {
        try { await addDoc(collection(db, "ervas"), { ...er, criadoEm: serverTimestamp() }); print("✔ " + er.nome); }
        catch(e) { print("✘ " + er.nome + ": " + e.message, "err"); }
      }

      // Rezas
      print("\n--- Rezas & Orações ---", "sec");
      for (const r of REZAS) {
        try { await addDoc(collection(db, "rezas"), { ...r, criadoEm: serverTimestamp() }); print("✔ " + r.titulo); }
        catch(e) { print("✘ " + r.titulo + ": " + e.message, "err"); }
      }

      print("\n=== IMPORTAÇÃO CONCLUÍDA! ===", "sec");
      btn.disabled = false;
      btn2.disabled = false;
    });

    document.getElementById("btn-seed-ensinamentos").addEventListener("click", async () => {
      const btn = document.getElementById("btn-seed");
      const btn2 = document.getElementById("btn-seed-ensinamentos");
      btn.disabled = true;
      btn2.disabled = true;
      log.textContent = "";
      print("=== REIMPORTANDO ENSINAMENTOS ===\n", "sec");

      const ALL_ENSINAMENTOS = [
        ...ENSINAMENTOS_AULAS,
        ...ENSINAMENTOS_FUNDAMENTOS,
        ...ENSINAMENTOS_RITUAIS,
        ...ENSINAMENTOS_MEDIUNIDADE,
        ...ENSINAMENTOS_SAUDACOES,
        ...ENSINAMENTOS_ANJO
      ];

      // Apagar todos os ensinamentos existentes
      print("Apagando ensinamentos antigos...", "sec");
      try {
        const snap = await getDocs(collection(db, "ensinamentos"));
        for (const d of snap.docs) { await deleteDoc(doc(db, "ensinamentos", d.id)); }
        print("✔ " + snap.size + " ensinamentos apagados.\n");
      } catch(e) { print("✘ Erro ao apagar: " + e.message, "err"); }

      // Reimportar
      print("Importando " + ALL_ENSINAMENTOS.length + " ensinamentos...", "sec");
      for (const e of ALL_ENSINAMENTOS) {
        try { await addDoc(collection(db, "ensinamentos"), { ...e, criadoEm: serverTimestamp() }); print("✔ [" + e.categoria + "] " + e.titulo); }
        catch(err) { print("✘ " + e.titulo + ": " + err.message, "err"); }
      }

      print("\n=== ENSINAMENTOS REIMPORTADOS! ===", "sec");
      btn.disabled = false;
      btn2.disabled = false;
    });

  </script>
